# Tier-0 smoke audit: does Hubble-1B unlearning survive quantization?
# The built-in demo facts are the YAGO birthdates the Hubble Perturbed model memorized, so it serves as
# the "knows" base; the unlearned checkpoints are the ones that forgot at fp16. Runs on one A100.
base_model: allegrolab/hubble-1b-500b_toks-perturbed-hf@step238500

unlearned_models:
  NPO: Harsh01012/hubble-1b-npo-unlearned-yago-birthdate
  RMU: Harsh01012/hubble-1b-rmu-unlearned-yago-birthdate

forget_set: builtin:demo
max_facts: 5
max_new_tokens: 8

# fp16 must be first: it is the within-method baseline the recovery fraction is measured against.
quant_configs:
  - {name: fp16,     backend: none, bits: 16}
  - {name: int8,     backend: bnb,  bits: 8}
  - {name: nf4,      backend: bnb,  bits: 4, extra: {quant_type: nf4, double_quant: true}}
  - {name: fp4,      backend: bnb,  bits: 4, extra: {quant_type: fp4}}
  - {name: rtn-int8, backend: rtn,  bits: 8}
  - {name: rtn-int4, backend: rtn,  bits: 4}

lens:
  enabled: true
  use_tuned: false          # logit lens is the screen; tuned lens is an extension point
  band_frac: 0.5            # recovery depth is searched over the top half of the layers
  recovery_threshold: 0.25  # "within 25% of the base log-rank" defines representational recovery

dtype: float16
device: cuda
output_dir: runs/tier0
